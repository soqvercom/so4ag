name: publish-pypi
# Publishes the Python reader to PyPI. Started by hand; PyPI trusts this workflow (trusted publishing), no token is stored.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python readers/python/so4ag_reader.py conformance spec/conformance/0.1
      - run: python -m pip install build
      - run: python -m build readers/python --outdir dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
